<div class="step-container">

  <div class="split-layout">

    <div class="content-column animate-in-left">
      <div class="header-text">
        <h1>QUEL EST TON SECTEUR D'ACTIVITÉ ?</h1>
        <p class="subtitle">MOZE s'adapte à ton métier. On commence par en savoir plus.</p>
      </div>

      <div class="sector-list">

        <button class="sector-item"
                (click)="select('SANTE')"
                (mouseenter)="onMouseEnter('SANTE')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('SANTE')"
                (blur)="onMouseLeave()">
          <span class="label">Santé & Paramédical</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">🩺</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('SAP')"
                (mouseenter)="onMouseEnter('SAP')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('SAP')"
                (blur)="onMouseLeave()">
          <span class="label">Services à la personne</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">🧼</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('BTP')"
                (mouseenter)="onMouseEnter('BTP')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('BTP')"
                (blur)="onMouseLeave()">
          <span class="label">BTP & Artisans</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">👷</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('CREATIF')"
                (mouseenter)="onMouseEnter('CREATIF')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('CREATIF')"
                (blur)="onMouseLeave()">
          <span class="label">Créatifs & Communication</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">💻</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('CONSEIL')"
                (mouseenter)="onMouseEnter('CONSEIL')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('CONSEIL')"
                (blur)="onMouseLeave()">
          <span class="label">Conseil & Formation</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">📚</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('IMMO')"
                (mouseenter)="onMouseEnter('IMMO')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('IMMO')"
                (blur)="onMouseLeave()">
          <span class="label">Services immobilier</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">🏡</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

        <button class="sector-item"
                (click)="select('AUTRE')"
                (mouseenter)="onMouseEnter('AUTRE')"
                (mouseleave)="onMouseLeave()"
                (focus)="onMouseEnter('AUTRE')"
                (blur)="onMouseLeave()">
          <span class="label">Autre activité</span>
          <div class="icons-group">
            <span class="emoji" aria-hidden="true">🤷‍♀️</span>
            <img src="assets/icons/arrow.svg" class="arrow-icon" alt="" aria-hidden="true" width="16" height="16">
          </div>
        </button>

      </div>

      <!-- Rappel de connexion. C'était une ligne de texte avec un « Clique ici » souligné,
           perdue sous la liste des secteurs : le visiteur qui a déjà un compte s'engageait
           dans le tunnel sans la voir. Encadré + vrai bouton, à la même adresse que le
           « Déjà inscrit ? » de la barre (source unique : config/nav-groups). -->
      <div class="footer-link">
        <p class="footer-link__text">Tu as déjà un compte MOZE&nbsp;?</p>
        <a class="footer-link__cta" [href]="loginUrl">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
          </svg>
          Je me connecte
        </a>
      </div>
    </div>

    <div class="visual-column animate-in-right">
      <div class="image-wrapper">
        <img [src]="currentImage()" alt="Illustration du secteur" class="dynamic-image" width="600" height="650">
      </div>
    </div>

  </div>
</div>
