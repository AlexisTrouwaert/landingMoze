<div class="step-container">

  <!-- Hero — 2 blocs BONNE/NOUVELLE + statement + bravo -->
  <div class="hero">
    <h1 class="hero-title">
      <span class="title-block title-block--blue">Bonne</span>
      <span class="title-block title-block--green">nouvelle&nbsp;!</span>
    </h1>

    <p class="hero-statement">
      Ton inscription est <span class="confirmed-pill">confirmée</span>
    </p>

    <p class="hero-bravo">
      Bravo, tu as désormais rejoint le club des indépendants structurés&nbsp;!
    </p>
  </div>

  <!-- Email notice — discrète mais visible -->
  <div class="email-notice" role="status">
    <span class="email-icon" aria-hidden="true">📬</span>
    <div class="email-notice-text">
      <strong>Vérifie ta boîte de réception</strong>
      <span>Tu as reçu un e-mail pour créer ton mot de passe.</span>
    </div>
  </div>

  <!-- Confirmation checkbox — débloque les cards -->
  <label class="confirm-toggle" for="confirmEmailReceived">
    <input type="checkbox"
           id="confirmEmailReceived"
           class="confirm-input"
           (change)="toggleConfirmation($event)" />
    <span class="confirm-check" aria-hidden="true"></span>
    <span class="confirm-label">
      J'ai bien reçu l'e-mail et je suis prêt à continuer
    </span>
  </label>

  <!-- Question incitative — gros bloc highlight vert, grisé tant que pas confirmé -->
  <h2 class="cards-question" [class.cards-question--unlocked]="isConfirmed()">
    <span class="cards-question-block">Par quoi souhaites-tu commencer&nbsp;?</span>
  </h2>

  <!-- 2 cards de redirection — intention pure, une seule phrase par card -->
  <div class="cards" [class.cards--unlocked]="isConfirmed()">

    <button type="button"
            class="card card--app"
            [disabled]="!isConfirmed()"
            (click)="goToConnexion()">
      <div class="card-shine" aria-hidden="true"></div>
      <span class="card-badge">Espace Facturation</span>
      <span class="card-text">Je veux faire<br>ma première facture</span>
    </button>

    <button type="button"
            class="card card--place"
            [disabled]="!isConfirmed()"
            (click)="goToPlace()">
      <div class="card-shine" aria-hidden="true"></div>
      <span class="card-badge card-badge--accent">Réseau &amp; Affaires</span>
      <span class="card-text">Je veux explorer<br>le réseau social</span>
    </button>

  </div>

</div>
