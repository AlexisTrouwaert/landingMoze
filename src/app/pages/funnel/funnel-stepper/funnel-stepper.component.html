<nav class="stepper"
     [class.stepper--reseau]="isReseau()"
     aria-label="Progression de l'inscription">

  <!-- Légende compacte (mobile uniquement) -->
  <p class="stepper-caption">
    Étape {{ displayStep() }} sur {{ steps().length }}
    <span class="stepper-caption-label">·&nbsp;{{ currentLabel() }}</span>
  </p>

  <ol class="stepper-track">
    @for (label of steps(); track label; let i = $index) {
      <li class="stepper-step"
          [class.is-done]="current() > i + 1"
          [class.is-current]="current() === i + 1"
          [class.is-reachable]="i + 1 <= maxStep()"
          [attr.aria-current]="current() === i + 1 ? 'step' : null">

        <button type="button"
                class="stepper-trigger"
                [disabled]="i + 1 > maxStep() || current() === i + 1"
                [attr.aria-label]="'Aller à l\'étape ' + (i + 1) + ' : ' + label"
                (click)="goTo(i)">
          <span class="stepper-dot">
            @if (current() > i + 1) {
              <svg class="stepper-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
              </svg>
            } @else {
              <span aria-hidden="true">{{ i + 1 }}</span>
            }
          </span>

          <span class="stepper-label">{{ label }}</span>
        </button>
      </li>
    }
  </ol>
</nav>
