<div class="funnel-container">
  <!-- Dock unifié (identique à l'accueil / au blog). Logo = abandon ; « Retour » = étape précédente. -->
  <app-floating-dock
    [groups]="navGroups"
    [buttonLabel]="fs.currentStep() > 1 ? 'Retour' : null"
    (buttonClick)="fs.previousStep()"
    (logoClick)="goHome()"
    (linkAction)="onDockAction($event)"></app-floating-dock>

  <main class="step-content">
    <!-- Première étape rendue directement, sans `@defer` : un bloc différé n'est pas rendu côté
         serveur, si bien que `/commencer` ne partait qu'avec son dock — pas de `<h1>`, pas une
         ligne du contenu pour les robots. Les étapes suivantes restent différées : elles ne sont
         atteintes qu'après une interaction, personne ne les indexe. -->
    @if (fs.currentStep() === 1) {
      <app-sector-step />
    }
    @if (fs.currentStep() === 2) {
      @defer (on immediate) { <app-sap-step /> }
    }
    @if (fs.currentStep() === 3) {
      @defer (on immediate) { <app-interstitial-step /> }
    }
    @if (fs.currentStep() === 4) {
      @defer (on immediate) { <app-redirect-step /> }
    }
  </main>
</div>
