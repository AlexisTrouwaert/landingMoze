<app-floating-dock [buttonLabel]="'Retour'" (buttonClick)="goBlog()" (logoClick)="goHome()"></app-floating-dock>

<div class="article-page">
  @if (loading()) {
    <p class="state">Chargement…</p>
  } @else if (notFound()) {
    <div class="state state--404">
      <h1>Article introuvable</h1>
      <p>Cet article n'existe pas ou n'est plus publié.</p>
      <a class="btn" [routerLink]="['/blog']">← Retour au blog</a>
    </div>
  } @else {
    @if (article(); as a) {
      <app-article-view [article]="a" />

      @if (related().length) {
        <aside class="related" aria-labelledby="related-title">
          <h2 id="related-title" class="related__title">À lire ensuite</h2>
          <div class="related__grid">
            @for (item of related(); track item.id) {
              <app-article-card [article]="item" [link]="['/blog', item.slug]" />
            }
          </div>
        </aside>
      }
    }
  }
</div>
