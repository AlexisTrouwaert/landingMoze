<section class="steps-container">
  <div class="grid-patch" aria-hidden="true"></div>
  <div class="header-section" appScrollReveal>
    <p class="surtitle">EN 4 ÉTAPES</p>
    <h2 class="main-title">
      Comment ça marche, <span class="highlight-green">à plusieurs</span>
    </h2>
  </div>

  <div class="cards-grid">
    @for (step of steps(); track step.num; let i = $index) {
      <div class="step-card" [class]="step.theme"
           [style.--bubble-delay]="(i * -3.5) + 's'"
           appScrollReveal [delay]="i * 100"
           (mousemove)="onCardMouseMove($event)"
           (mouseleave)="onCardMouseLeave($event)">

        <div class="card-content">
          <div class="card-header">
            <span class="step-number">{{ step.num }}</span>
            <span class="step-pill">{{ step.pill }}</span>
          </div>
          <h3 class="step-title">{{ step.title }}</h3>
          <p class="step-desc">{{ step.desc }}</p>
        </div>

      </div>
    }
  </div>

  <div class="cta-wrapper" appScrollReveal>
    <button class="btn-primary" (click)="goToFunnel()">Créer mon compte gratuit</button>
  </div>
</section>
