<section class="tool-container">
  <div class="header-section">
    <p class="surtitle">FONCTIONNALITÉS</p>
    <h2 class="main-title">
      Bien plus qu'un outil de <span class="highlight-green">facturation</span>
    </h2>
    <p class="subtitle">
      Moze a été pensé pour les indépendants qui veulent grandir, pas seulement facturer.
    </p>
  </div>

  <div class="cards-grid">
    @for (feature of features(); track feature.t1) {
      <div class="feature-card">
        <div class="card-title">
          <span class="title-green">{{ feature.t1 }}</span>
          <span class="title-white">{{ feature.t2 }}</span>
        </div>
        <p class="card-desc">{{ feature.desc }}</p>
        <div class="card-badge">{{ feature.badge }}</div>
      </div>
    }
  </div>

  <div class="cta-wrapper">
    <button class="btn-primary" (click)="goToFunnel()">Je découvre mon nouvel outil &rarr;</button>
  </div>
</section>
