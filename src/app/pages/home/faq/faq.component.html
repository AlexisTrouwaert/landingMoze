<div class="faq-container">
  <div class="banner-container" appScrollReveal>
    <div class="banner-header">
      <h3>FOIRE AUX QUESTIONS</h3>
    </div>
    <div class="banner-header-secondary">
      <h3>FOIRE AUX QUESTIONS</h3>
    </div>
  </div>
  <div class="questions-container" (click)="onAnswerLinkClick($event)">
    <div class="left-questions">

      @for (q of [0,1,2,3]; track q; let i = $index) {
        <div class="question-container" [class.extended]="selectedQ() === q">
          <button class="title-container" type="button"
                  [attr.aria-expanded]="selectedQ() === q"
                  [attr.aria-controls]="'answer-' + q"
                  (click)="changeSelectedQ(q)">
            <p class="question-title">{{ leftQuestions[i].title }}</p>
            <svg class="faq-icon" [class.open]="selectedQ() === q"
                 width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="answer-wrapper" [id]="'answer-' + q" role="region" [attr.aria-label]="leftQuestions[i].title">
            <div class="answer">
              <p [innerHTML]="leftQuestions[i].answer"></p>
            </div>
          </div>
        </div>
      }

    </div>

    <div class="right-questions">

      @for (q of [4,5,6,7]; track q; let i = $index) {
        <div class="question-container" [class.extended]="selectedQ() === q">
          <button class="title-container" type="button"
                  [attr.aria-expanded]="selectedQ() === q"
                  [attr.aria-controls]="'answer-' + q"
                  (click)="changeSelectedQ(q)">
            <p class="question-title">{{ rightQuestions[i].title }}</p>
            <svg class="faq-icon" [class.open]="selectedQ() === q"
                 width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="answer-wrapper" [id]="'answer-' + q" role="region" [attr.aria-label]="rightQuestions[i].title">
            <div class="answer">
              <p [innerHTML]="rightQuestions[i].answer"></p>
            </div>
          </div>
        </div>
      }

    </div>
  </div>
</div>
