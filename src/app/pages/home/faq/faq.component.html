<div class="faq-container">
  <div class="banner-container" appScrollReveal>
    <!-- H2 et non H3 : la section vit sous le H1 de l'accueil, un H3 sans H2
         parent est un saut de niveau. Le doublon du bandeau est purement
         décoratif : il sort de l'arborescence (aria-hidden, pas un titre). -->
    <div class="banner-header">
      <h2>FOIRE AUX QUESTIONS</h2>
    </div>
    <div class="banner-header-secondary" aria-hidden="true">
      <p>FOIRE AUX QUESTIONS</p>
    </div>
  </div>
  <div class="questions-container" (click)="onAnswerLinkClick($event)">
    <div class="left-questions">

      @for (item of leftQuestions; track item.title; let i = $index) {
        <div class="question-container" [class.extended]="selectedQ() === i" appScrollReveal [delay]="i * 80">
          <button class="title-container" type="button"
                  [attr.aria-expanded]="selectedQ() === i"
                  [attr.aria-controls]="'answer-' + i"
                  (click)="changeSelectedQ(i)">
            <p class="question-title">{{ item.title }}</p>
            <svg class="faq-icon" [class.open]="selectedQ() === i"
                 width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="answer-wrapper" [id]="'answer-' + i" role="region" [attr.aria-label]="item.title">
            <div class="answer">
              <div [innerHTML]="item.answer"></div>
            </div>
          </div>
        </div>
      }

    </div>

    <div class="right-questions">

      @for (item of rightQuestions; track item.title; let i = $index) {
        <div class="question-container" [class.extended]="selectedQ() === leftQuestions.length + i" appScrollReveal [delay]="i * 80">
          <button class="title-container" type="button"
                  [attr.aria-expanded]="selectedQ() === leftQuestions.length + i"
                  [attr.aria-controls]="'answer-' + (leftQuestions.length + i)"
                  (click)="changeSelectedQ(leftQuestions.length + i)">
            <p class="question-title">{{ item.title }}</p>
            <svg class="faq-icon" [class.open]="selectedQ() === leftQuestions.length + i"
                 width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="answer-wrapper" [id]="'answer-' + (leftQuestions.length + i)" role="region" [attr.aria-label]="item.title">
            <div class="answer">
              <div [innerHTML]="item.answer"></div>
            </div>
          </div>
        </div>
      }

    </div>
  </div>

  <div class="common-faq" appScrollReveal>
    <h3 class="common-faq-title">Questions fréquentes</h3>
    <div class="common-questions" (click)="onAnswerLinkClick($event)">
      @for (item of commonQuestions; track item.title; let i = $index) {
        <div class="question-container" [class.extended]="selectedQ() === leftQuestions.length + rightQuestions.length + i" appScrollReveal [delay]="i * 80">
          <button class="title-container" type="button"
                  [attr.aria-expanded]="selectedQ() === leftQuestions.length + rightQuestions.length + i"
                  [attr.aria-controls]="'answer-' + (leftQuestions.length + rightQuestions.length + i)"
                  (click)="changeSelectedQ(leftQuestions.length + rightQuestions.length + i)">
            <p class="question-title">{{ item.title }}</p>
            <svg class="faq-icon" [class.open]="selectedQ() === leftQuestions.length + rightQuestions.length + i"
                 width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="answer-wrapper" [id]="'answer-' + (leftQuestions.length + rightQuestions.length + i)" role="region" [attr.aria-label]="item.title">
            <div class="answer">
              <div [innerHTML]="item.answer"></div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
