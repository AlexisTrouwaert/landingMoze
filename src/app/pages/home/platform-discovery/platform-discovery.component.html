<section class="discovery-container">
  <div class="title-wrapper">
    <span class="highlight-blue">DÉCOUVRE</span>
    <span class="highlight-green">NOTRE PLATEFORME</span>
  </div>

  <div class="video-wrapper">
    @if (videoPlaying()) {
      <iframe
        [src]="videoUrl()"
        title="Découvre notre plateforme Moze"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    } @else {
      <div class="video-facade"
           (click)="playVideo()"
           (keydown.enter)="playVideo()"
           role="button"
           tabindex="0"
           aria-label="Lire la vidéo de présentation Moze">
        <img
          src="assets/images/yt-thumbnail.webp"
          alt="Miniature de la vidéo de présentation Moze"
          width="700"
          height="394">
        <span class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff0000"/>
            <path d="M45 24 27 14v20" fill="white"/>
          </svg>
        </span>
      </div>
    }
  </div>
</section>
