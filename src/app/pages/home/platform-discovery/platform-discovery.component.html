<section class="discovery-container">
  <div class="title-wrapper">
    <span class="highlight-blue">DÉCOUVRE</span>
    <span class="highlight-green">NOTRE PLATEFORME</span>
  </div>

  <div class="video-wrapper">
    <iframe
      [src]="videoUrl()"
      title="Découvre notre plateforme Moze"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
</section>
