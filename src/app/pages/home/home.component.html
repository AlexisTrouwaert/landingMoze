<div class="page-container">

  <app-floating-dock
    [groups]="navGroups"
    [ctaLabel]="'je commence gratuitement'"
    [loginLabel]="'Déjà inscrit ?'"
    [loginHref]="appLoginUrl"
    (ctaClick)="goToFunnel()"
    (linkAction)="onDockAction($event)"></app-floating-dock>
  <main>
    <app-landing-section id="main-content"></app-landing-section>

    @defer (on idle) {
      <app-activity-steps id="etapes" class="scroll-anchor"></app-activity-steps>
    }

    @defer (on idle) {
      <app-tool id="outils" class="scroll-anchor"></app-tool>
    }

    @defer (on idle) {
      <app-media-press id="presse" class="scroll-anchor"></app-media-press>
    }

    @defer (on idle) {
      <app-customer-reviews id="avis" class="scroll-anchor"></app-customer-reviews>
    }

    @defer (on idle) {
      <app-tarif id="offres" class="scroll-anchor"></app-tarif>
    }

    @defer (on idle) {
      <app-faq id="faq" class="scroll-anchor"></app-faq>
    }

    @defer (on idle) {
      <app-download-apps id="app" class="scroll-anchor"></app-download-apps>
    }

    @defer (on idle) {
      <app-email id="newsletter" class="scroll-anchor"></app-email>
    }
  </main>

<!--  @defer (on idle) {-->
<!--    <app-follow-us></app-follow-us>-->
<!--  }-->

  @defer (on idle) {
    <app-footer></app-footer>
  }

  <app-scroll-top></app-scroll-top>
</div>
