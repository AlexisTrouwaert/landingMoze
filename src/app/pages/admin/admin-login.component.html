<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Espace admin</h1>
    <p class="subtitle">Connectez-vous pour gérer le blog.</p>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="admin@moze.fr" />
    </label>

    <label>
      <span>Mot de passe</span>
      <app-password-input formControlName="password" autocomplete="current-password" placeholder="••••••••"></app-password-input>
    </label>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
