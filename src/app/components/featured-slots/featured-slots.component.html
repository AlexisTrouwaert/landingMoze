<ul class="slots" role="list">
  @for (s of slots(); track s.slotId) {
    @let etat = state(s);
    <li>
      <button
        type="button"
        class="slots__row"
        [class]="'slots__row is-' + etat"
        [disabled]="etat === 'taken'"
        (click)="choose(s)"
      >
        <span class="slots__icon" aria-hidden="true">
          @switch (etat) {
            @case ('leaving') {
              <!-- Sortant : une flèche qui quitte le cadre. -->
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                <path d="M10 17 5 12l5-5M5 12h11" />
              </svg>
            }
            @case ('taken') {
              <!-- Pris : un cadenas. -->
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
            }
            @case ('arriving') {
              <!-- Arrivant : un calendrier, il prend la place à une date. -->
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M3 10h18M8 3v4M16 3v4" />
              </svg>
            }
            @default {
              <!-- En place : l'étoile pleine de la une. -->
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none">
                <path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8Z" />
              </svg>
            }
          }
        </span>

        <span class="slots__body">
          <span class="slots__title">{{ s.title }}</span>
          <span class="slots__state">
            @switch (etat) {
              @case ('leaving') { Cédera sa place à cet article }
              @case ('taken') { Déjà retenu par « {{ claimedBy(s) }} » }
              @case ('arriving') {
                Pas encore à la une — arrive le {{ s.since ? enJour(s.since) : '' }}
              }
              @default {
                À la une aujourd'hui
                <!-- Place déjà promise : la reprendre annulerait l'échange prévu. -->
                @if (s.nextChange?.publishedAt; as prevu) {
                  <span class="slots__warn">— promise le {{ enJour(prevu) }}</span>
                }
              }
            }
          </span>
        </span>

        @if (cta(); as libelle) {
          <span class="slots__cta">{{ libelle }}</span>
        }
      </button>
    </li>
  }
</ul>
