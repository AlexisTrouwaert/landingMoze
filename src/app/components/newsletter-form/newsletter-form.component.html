@if (status() === 'SUCCESS') {
  <div class="status-alert success">
    <span>✓ Votre inscription a été enregistrée avec succès.</span>
  </div>
}
@if (status() === 'ERROR') {
  <div class="status-alert error">
    <span>✕ Trop de tentatives, veuillez réessayer plus tard.</span>
  </div>
}

<form [class.shake]="isShaking()" (submit)="onSubmit($event)">
  <div class="form-row">
    <input
      type="email"
      name="email"
      class="newsletter-input"
      [class.input-error]="emailError()"
      [ngModel]="emailValue()"
      (ngModelChange)="emailValue.set($event); emailError.set(false)"
      placeholder="Votre adresse email"
      aria-label="Adresse email"
    />

    <input type="text" name="check_field" [ngModel]="honeypotValue()" (ngModelChange)="honeypotValue.set($event)" style="display:none" tabindex="-1" aria-hidden="true" />

    <button type="submit" class="newsletter-submit-btn" [disabled]="status() === 'LOADING'">
      {{ status() === 'LOADING' ? 'Envoi...' : "Je m'abonne" }}
    </button>
  </div>

  <div class="optin-row">
    <label class="custom-checkbox-label" [class.text-error]="optInError()">
      <input
        type="checkbox"
        name="optin"
        class="hidden-checkbox"
        [ngModel]="optInValue()"
        (ngModelChange)="optInValue.set($event); optInError.set(false)"
      />
      <div class="custom-checkmark" [class.error-box]="optInError()"></div>
      <span class="optin-text">
        J'accepte de recevoir vos e-mails et votre
        <a href="/politique-confidentialite" target="_blank" rel="noopener" (click)="$event.stopPropagation()">politique de confidentialité</a>.
      </span>
    </label>
  </div>

  <div class="optin-row">
    <label class="custom-checkbox-label">
      <input
        type="checkbox"
        name="pixel_consent"
        class="hidden-checkbox"
        [ngModel]="pixelConsentValue()"
        (ngModelChange)="pixelConsentValue.set($event)"
      />
      <div class="custom-checkmark"></div>
      <span class="optin-text">
        J'accepte que Moze mesure l'ouverture de ses e-mails pour me proposer des contenus personnalisés.
        <em>(facultatif)</em>
      </span>
    </label>
  </div>
</form>
