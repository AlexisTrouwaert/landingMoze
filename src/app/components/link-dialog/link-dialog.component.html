@if (open()) {
  <div class="pd-backdrop" (click)="onCancel()">
    <div
      class="pd-card"
      role="dialog"
      aria-modal="true"
      (click)="$event.stopPropagation()"
    >
      <h2 class="pd-title">{{ title() }}</h2>
      @if (targets().length) {
        <label class="pd-label">Lien interne — remplit l'adresse pour vous</label>
        <select class="pd-select" [value]="selectedTarget()" (change)="onInternalPick($event)">
          <option value="">— Choisir une page ou un article —</option>
          @if (pages().length) {
            <optgroup label="Pages">
              @for (t of pages(); track t.url) {
                <option [value]="t.url">{{ t.label }}</option>
              }
            </optgroup>
          }
          @if (articles().length) {
            <optgroup label="Articles">
              @for (t of articles(); track t.url) {
                <option [value]="t.url">{{ t.label }}</option>
              }
            </optgroup>
          }
        </select>
      }
      <label class="pd-label">Adresse du lien (https://…)</label>
      <input
        class="pd-input"
        type="text"
        [value]="url()"
        (input)="onUrlInput($event)"
        (keydown.enter)="onConfirm()"
        autofocus
      />
      <label class="pd-label">Texte affiché (facultatif — l'adresse si vide)</label>
      <input
        class="pd-input"
        type="text"
        [value]="label()"
        (input)="onLabelInput($event)"
        (keydown.enter)="onConfirm()"
      />
      <div class="pd-actions">
        <button type="button" class="pd-btn pd-btn--ghost" (click)="onCancel()">
          Annuler
        </button>
        <button type="button" class="pd-btn" (click)="onConfirm()">
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
