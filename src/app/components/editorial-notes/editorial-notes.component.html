@if (notes().length) {
  <div class="notes">
    @for (n of notes(); track n.id) {
      <details class="note" [open]="ouvertes()">
        <summary class="note__head">
          <svg class="note__chevron" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 6 6 6-6 6" />
          </svg>
          <span class="note__name">{{ titre(n) }}</span>
          <span class="note__tag">Note de rédaction</span>
        </summary>

        <div class="note__content">
          <p class="note__body">{{ n.body }}</p>
          <button
            type="button"
            class="note__copy"
            [class.is-done]="copiee() === n.id"
            (click)="copier(n)"
          >
            @if (copiee() === n.id) {
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              Copié
            } @else {
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="12" height="12" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              Copier
            }
          </button>
        </div>
      </details>
    }
  </div>
}
